name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: fmt
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || \
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          git diff --check "$base_sha" HEAD
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        id: cargo_test
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p target/compat
          cargo test --all --all-features -- --color never 2>&1 | tee target/compat/cargo-test.log
      - name: psql golden compatibility suite
        id: psql_golden
        continue-on-error: true
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGDATABASE: postgres
          PGUSER: postgres
          PSQL_GOLDEN_BOOT_CMD: cargo run -p gpu_db_protocol --bin gpu-db-server -- --listen 127.0.0.1:55432
          PSQL_GOLDEN_WAIT_HOST: 127.0.0.1
          PSQL_GOLDEN_WAIT_PORT: 55432
          PSQL_GOLDEN_WAIT_TIMEOUT_SEC: 120
          PSQL_GOLDEN_REPORT: target/compat/psql-golden-report.json
        run: scripts/run_psql_golden.sh
      - name: compatibility scorecard
        if: always()
        run: |
          python3 scripts/generate_compat_scorecard.py \
            --input target/compat/cargo-test.log \
            --psql-report target/compat/psql-golden-report.json \
            --output docs/compatibility/scorecard.latest.json \
            --markdown docs/compatibility/scorecard.latest.md \
            --baseline docs/compatibility/scorecard.baseline.json
      - name: assert compatibility scorecard is checked in
        if: always()
        run: |
          git diff --exit-code -- \
            docs/compatibility/scorecard.latest.json \
            docs/compatibility/scorecard.latest.md
      - name: upload compatibility scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-scorecard
          path: |
            docs/compatibility/scorecard.latest.json
            docs/compatibility/scorecard.latest.md
            target/compat/psql-golden-report.json
      - name: assert compatibility gates
        if: always()
        run: |
          test "${{ steps.cargo_test.outcome }}" = success
          test "${{ steps.psql_golden.outcome }}" = success
