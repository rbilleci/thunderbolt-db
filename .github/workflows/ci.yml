name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: detect NVIDIA runtime
        id: gpu
        shell: bash
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No NVIDIA device is available; GPU-required runtime gates will be skipped."
          fi
      - name: fmt
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]] || \
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
          fi
          git diff --check "$base_sha" HEAD
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: host-neutral test
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          set -euo pipefail
          cargo test --workspace --all-features \
            --exclude gpu_db_engine \
            --exclude gpu_db_facade \
            --exclude gpu_db_protocol \
            --exclude gpu_db_server \
            -- --color never
      - name: GPU engine test
        if: steps.gpu.outputs.available == 'true'
        run: |
          set -euo pipefail
          cargo test -p gpu_db_engine --lib --all-features -- \
            --include-ignored --test-threads=1 --color never
