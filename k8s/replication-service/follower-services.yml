apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-db-replication-follower-2
  labels:
    app.kubernetes.io/name: gpu-db-replication-follower
    app.kubernetes.io/part-of: gpu-db
    gpu-db-follower-id: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-db-replication-follower
      gpu-db-follower-id: "2"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-db-replication-follower
        app.kubernetes.io/part-of: gpu-db
        gpu-db-follower-id: "2"
    spec:
      containers:
        - name: follower
          image: gpu-db-replication-service:local
          imagePullPolicy: IfNotPresent
          args:
            - --follower-service
            - --id
            - $(GPU_DB_REPLICATION_FOLLOWER_ID)
            - --expected-requests
            - $(GPU_DB_REPLICATION_EXPECTED_REQUESTS)
            - --listen
            - $(GPU_DB_REPLICATION_LISTEN_ADDR)
          env:
            - name: GPU_DB_REPLICATION_FOLLOWER_ID
              value: "2"
            - name: GPU_DB_REPLICATION_EXPECTED_REQUESTS
              value: "4"
            - name: GPU_DB_REPLICATION_LISTEN_ADDR
              value: 0.0.0.0:55432
          ports:
            - name: append
              containerPort: 55432
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-db-replication-follower-2
  labels:
    app.kubernetes.io/name: gpu-db-replication-follower
    app.kubernetes.io/part-of: gpu-db
    gpu-db-follower-id: "2"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gpu-db-replication-follower
    gpu-db-follower-id: "2"
  ports:
    - name: append
      port: 55432
      targetPort: append
---
