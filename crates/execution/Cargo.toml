[package]
name = "gpu_db_execution"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
libloading.workspace = true

[features]
# Analysis instrumentation (docs/proposals/feature-gated-instrumentation.md). OFF by default -> the gated
# probe code is not compiled (zero perturbation; we measure in --release). Enable for benches/measurement:
# `cargo run --features probe-timing ...`. Keep probes behind this rather than write-then-revert.
probe-timing = []
# Narrow cross-crate hardware fault injection used by engine recovery HAZARD tests.  It is never
# enabled by production dependencies and only makes the existing owned-stream fence return a
# caller-chosen CUDA status.
test-support = []

[dev-dependencies]
# Reader/writer snapshot substrate, used by the P1-M3 step-1 real-GPU soundness
# probe to publish a resident generation and prove epoch-safe reclamation of real
# device memory. Test-only edge (snapshot is std-only; no dependency cycle).
gpu_db_snapshot = { path = "../snapshot" }
# Test-only SHA-256 reference for device known-answer coverage; production execution has no CPU
# digest implementation or dependency.
sha2 = "0.10"
