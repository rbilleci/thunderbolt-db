# Reader/writer snapshot-generation pattern (prototype→production plan, P1-M2
# spike). The concurrency substrate the engine adopts: an immutable, Arc-shared
# generation that many readers execute against lock-free while a serialized
# writer atomically publishes the next generation; old generations are retired by
# Arc refcount (epoch reclamation) only after their last reader drains. std-only.
