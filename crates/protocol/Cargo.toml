[package]
name = "gpu_db_protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
rustls = "0.23"
sha2 = "0.10"
thiserror.workspace = true
# Neutral SQL vocabulary (AST + `SqlType`/`SqlValue` + parser + `ParseError`)
# lives in the lower `gpu_db_sql` crate so the engine can depend on it without
# the wire layer. Protocol re-exports it (`pub use gpu_db_sql::*`) to keep its
# public API byte-compatible (roadmap §9.2).
gpu_db_sql = { path = "../sql" }

[dev-dependencies]
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"
