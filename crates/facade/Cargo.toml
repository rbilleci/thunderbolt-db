[package]
name = "gpu_db_facade"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
probe-timing = ["gpu_db_engine/probe-timing"]

# Protocol-neutral façade over the engine (prototype→production plan, P0-M1).
# Depends on the engine (execution) and on the lower `gpu_db_sql` crate for the
# SQL value/command vocabulary it converts away from. It has no wire dependency:
# all PostgreSQL-specific mapping lives in `pg_adapter` over neutral façade types
# (roadmap §9.2 — the engine→protocol dependency is now inverted).

[dependencies]
thiserror.workspace = true
gpu_db_engine = { path = "../engine" }
gpu_db_sql = { path = "../sql" }
# Thread-3 batched/async GPU submission (P0-M? staged): the façade owns the
# point-lookup batcher (coalescer thread + per-batch read lock). It reuses the
# generic dual-trigger batcher rather than re-deriving M0's ad-hoc backlog loop.
gpu_db_batching = { path = "../batching" }
# `oneshot` is the park-point: an async ingress task enqueues a point-lookup and
# `await`s the receiver while holding no semaphore permit. Only the `sync` feature
# is needed (oneshot/mpsc), not the runtime — the coalescer is a plain OS thread.
tokio = { version = "1", features = ["sync"] }
