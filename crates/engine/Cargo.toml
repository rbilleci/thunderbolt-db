[package]
name = "gpu_db_engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
imbl.workspace = true
arc-swap.workspace = true
sha2 = "0.10"
serde_json = "1"
itoa = "1"
gpu_db_types = { path = "../types" }
gpu_db_replication = { path = "../replication" }
gpu_db_wal = { path = "../wal" }
gpu_db_txn = { path = "../txn" }
gpu_db_metrics = { path = "../metrics" }
gpu_db_observability = { path = "../observability" }
gpu_db_sql = { path = "../sql" }
gpu_db_batching = { path = "../batching" }
gpu_db_planner = { path = "../planner" }
gpu_db_execution = { path = "../execution" }
gpu_db_storage = { path = "../storage" }
gpu_db_snapshot = { path = "../snapshot" }
# libpg_query bindings (vendors + builds the real PostgreSQL parser as C): the
# SQL->ResidentExpr binding for the general GPU executor (docs/architecture/18).
# Heavy first build; isolated to this one crate (Charter rule 2, doc 18 §2.4).
pg_query = "6"

[features]
# Passthrough for the analysis-instrumentation feature (docs/proposals/feature-gated-instrumentation.md):
# enabling it here forwards to gpu_db_execution so the predicate/result-path probes in BOTH crates light up
# with a single `cargo run --example ... --features probe-timing`. OFF by default (zero-cost).
probe-timing = ["gpu_db_execution/probe-timing", "gpu_db_wal/probe-timing"]
# End-to-end CUDA fault-injection coverage for recovery. It is opt-in so normal engine tests and
# production builds never compile the execution fault hook.
test-support = ["gpu_db_execution/test-support"]

[dev-dependencies]
# Phase-D SLO benchmark: jemalloc arm (the engine library itself never chooses an allocator).
tikv-jemallocator.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
# Examples route serving paths through the protocol-neutral façade. This is a
# dev-only back-edge (facade depends on engine); it does not affect the library
# build graph.
gpu_db_facade = { path = "../facade" }
