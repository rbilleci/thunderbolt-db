[package]
name = "gpu_db_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
gpu_db_types = { path = "../types" }
gpu_db_replication = { path = "../replication" }
gpu_db_wal = { path = "../wal" }
gpu_db_txn = { path = "../txn" }
gpu_db_metrics = { path = "../metrics" }
gpu_db_observability = { path = "../observability" }
gpu_db_protocol = { path = "../protocol" }
gpu_db_batching = { path = "../batching" }
gpu_db_planner = { path = "../planner" }
gpu_db_execution = { path = "../execution" }
gpu_db_storage = { path = "../storage" }
gpu_db_snapshot = { path = "../snapshot" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
# Examples route serving paths through the protocol-neutral façade. This is a
# dev-only back-edge (facade depends on engine); it does not affect the library
# build graph.
gpu_db_facade = { path = "../facade" }
