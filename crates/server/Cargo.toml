[package]
name = "gpu_db_server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
probe-timing = ["gpu_db_facade/probe-timing"]

# Engine-backed pgwire server (prototype→production plan, P0-M3). Serves the
# relational subset through the protocol-neutral façade: pgwire wire framing from
# `gpu_db_protocol`, execution via `gpu_db_facade` over the real `Engine`. This is
# the sole product listener — a server that speaks the wire AND uses the engine.

[[bin]]
name = "gpu-db-engine-server"
path = "src/main.rs"

[dependencies]
gpu_db_protocol = { path = "../protocol" }
gpu_db_facade = { path = "../facade" }
base64 = "0.22"
hmac = "0.12"
pbkdf2 = "0.12"
pg_query = "6"
rand = "0.8"
rustls = "0.23"
sha2 = "0.10"
stringprep = "0.1"
subtle = "2"
# Production global allocator: jemalloc cuts multi-threaded malloc-arena contention vs
# glibc under the engine's concurrent read+write load (measured ~1.4-1.7x throughput).
tikv-jemallocator.workspace = true
# Async ingress (P1-M5): a tokio acceptor + per-connection tasks so idle connections are
# cheap parked tasks (connection scale), bridging to the blocking engine via spawn_blocking.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "macros",
    "time",
] }

[dev-dependencies]
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
bytes = "1"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "uuid", "bigdecimal"] }
bigdecimal = "0.4"
# GPU-native server tests and the retained-query mix example construct a real engine and inspect
# device-route facts without introducing another listener or product submission boundary.
gpu_db_engine = { path = "../engine" }
gpu_db_execution = { path = "../execution" }
# The WRITE-001 pgwire convergence gate reads the segment emitted by the real served engine after
# closing it.  This checks durable route identity at the protocol boundary without exposing an
# engine-internal test accessor through the facade.
gpu_db_wal = { path = "../wal" }
