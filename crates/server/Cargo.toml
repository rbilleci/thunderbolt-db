[package]
name = "gpu_db_server"
version.workspace = true
edition.workspace = true
license.workspace = true

# Engine-backed pgwire server (prototype→production plan, P0-M3). Serves the
# relational subset through the protocol-neutral façade: pgwire wire framing from
# `gpu_db_protocol`, execution via `gpu_db_facade` over the real `Engine`. This is
# the unification target — a server that speaks the wire AND uses the engine —
# distinct from the legacy in-memory `gpu-db-server` in the protocol crate.

[[bin]]
name = "gpu-db-engine-server"
path = "src/main.rs"

[dependencies]
gpu_db_protocol = { path = "../protocol" }
gpu_db_facade = { path = "../facade" }
# Production global allocator: jemalloc cuts multi-threaded malloc-arena contention vs
# glibc under the engine's concurrent read+write load (measured ~1.4-1.7x throughput).
tikv-jemallocator.workspace = true
# Async ingress (P1-M5): a tokio acceptor + per-connection tasks so idle connections are
# cheap parked tasks (connection scale), bridging to the blocking engine via spawn_blocking.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "macros",
    "time",
] }

[dev-dependencies]
tokio-postgres = "0.7"
bytes = "1"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
# For the GPU-retained benchmark example only: it builds + warms an Engine to GPU residency,
# then serves it through the façade. The library itself never depends on the engine directly.
gpu_db_engine = { path = "../engine" }
# The engine+pgwire integration examples (`p8_engine_*`) live here — the server is
# the layer that legitimately spans both the engine and the wire crate. They reach
# into the engine's residency/metrics internals directly, so those are dev-deps too.
gpu_db_execution = { path = "../execution" }
gpu_db_metrics = { path = "../metrics" }
